# Publishes the Kotlin client to GitHub Packages for every release tag (the same tag the Swift package uses).
name: Publish Kotlin client
on:
  push:
    tags: ["*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0" }
      - run: gradle test publish -Pversion=${GITHUB_REF_NAME}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
