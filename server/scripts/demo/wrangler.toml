# The public demo at demo.skorostats.com (worker.js). Not a template for your own instance:
# that's config.example/. Deployed from server/ with
#   npx wrangler deploy -c scripts/demo/wrangler.toml
name = "skoro-stats-demo"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "demo.skorostats.com", custom_domain = true }]

# The demo's own apps, in place of config/apps.js.
[alias]
"#apps" = "./apps.js"

[[d1_databases]]
binding = "DB"
database_name = "skoro-stats-demo"
database_id = "0c695db6-4f59-4281-9197-871c37ffbf6a"
migrations_dir = "../../migrations"

# Dashboard reads: 60 a minute per address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Hourly, a minute before the hour ends: that hour's made-up sessions.
[triggers]
crons = ["59 * * * *"]

[observability]
enabled = false
